[mypy]
# The engine and the persona scripts run on the Linux CI runner. Local lint
# checks the same Linux view for parity with CI.
platform = linux
# Persona eval cases hold planted defects for the reviewers to find.
exclude = (^|/)eval/cases/

# PyYAML ships no stubs with this toolchain.
[mypy-yaml]
ignore_missing_imports = True

[mypy-yaml.*]
ignore_missing_imports = True
