---
# Always-on caller for an adopting repository: .github/workflows/persona-review.yml
#
# foucault and euler review every pull request after CI finishes. Mark the
# "foucault / security" and "euler / quality" checks as required in branch
# protection. Replace the all-zero SHA with one agents-personas commit SHA in
# every uses: pin and every personas_ref. Replace "CI" with the name of the CI
# workflow.
#
# A required check posted from workflow_run attaches to the head SHA. A
# skipped CI run posts no review check, so branch protection waits. See
# docs/migration.md for that caveat.
#
# The "Migration pull request" section of docs/migration.md covers these
# hazards. Land this caller alone and small. The old callers on the base
# branch review the migration pull request. Keep a vendored adapter directory
# until no configuration read from the base branch names it. The CodeQL paths
# count. Update rulesets for the new check names before the merge.
#
# Never skip a job because a check run with a VERDICT: title exists. Any
# workflow with checks: write can publish one. The engine reuses only failing
# checks with its own review key. A review job that needs a job skipped for
# forks keeps a status function such as !cancelled() in its if: condition.

name: persona-review

"on":
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: persona-review-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  foucault:
    if: github.event.workflow_run.event == 'pull_request'
    permissions:
      checks: write
      contents: read
      pull-requests: write
    # A double-quoted scalar joins the escaped line break without a space.
    uses: "abuzucom/agents-personas/.github/workflows/foucault-security-review.yml@\
      0000000000000000000000000000000000000000"
    with:
      personas_ref: "0000000000000000000000000000000000000000"
    secrets:
      MODEL_API_KEY: ${{ secrets.OLLAMA_API_KEY }}

  euler:
    if: github.event.workflow_run.event == 'pull_request'
    permissions:
      checks: write
      contents: read
      pull-requests: write
    uses: abuzucom/agents-personas/.github/workflows/euler-quality-review.yml@0000000000000000000000000000000000000000
    with:
      personas_ref: "0000000000000000000000000000000000000000"
      exclude_paths: "tests/**"
    secrets:
      MODEL_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
