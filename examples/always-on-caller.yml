# Always-on caller for an adopting repository: .github/workflows/persona-review.yml
#
# foucault and euler review every pull request after CI finishes. Mark the
# "foucault / security" and "euler / quality" checks as required in branch
# protection. Replace the all-zero SHA with one agents-personas commit SHA in
# every uses: pin and every personas_ref. Replace "CI" with the name of the CI
# workflow. The euler wrapper lands with the euler migration.
#
# A required check posted from workflow_run attaches to the head SHA. A
# skipped CI run posts no review check, so branch protection waits. See
# docs/migration.md for that caveat.

name: persona-review

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: persona-review-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  foucault:
    if: github.event.workflow_run.event == 'pull_request'
    permissions:
      checks: write
      contents: read
      pull-requests: write
    uses: abuzucom/agents-personas/.github/workflows/foucault-security-review.yml@0000000000000000000000000000000000000000
    with:
      personas_ref: "0000000000000000000000000000000000000000"
    secrets:
      MODEL_API_KEY: ${{ secrets.OLLAMA_API_KEY }}

  euler:
    if: github.event.workflow_run.event == 'pull_request'
    permissions:
      checks: write
      contents: read
      pull-requests: write
    uses: abuzucom/agents-personas/.github/workflows/euler-quality-review.yml@0000000000000000000000000000000000000000
    with:
      personas_ref: "0000000000000000000000000000000000000000"
    secrets:
      MODEL_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
