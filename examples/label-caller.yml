---
# Label caller for an adopting repository: .github/workflows/persona-review-labels.yml
#
# A maintainer adds a <persona>-scan-requested label to request a review.
# A repository without automatic scans can use this file alone. Only people
# with triage access or higher can add a label.
# Each new push to a labeled pull request reviews again. These checks stay
# optional in branch protection. Replace the all-zero SHA with one
# agents-personas commit SHA in every uses: pin and every personas_ref.
#
# Removing the stop-requested label reviews again with every persona whose
# scan label is on. Removing any other label starts nothing.
#
# pull_request_target runs this file from the base branch, so a pull request
# cannot edit the caller. The engine reads the head as git objects and never
# executes it. Fork pull requests get a skipped check and no secret.

name: persona-review-labels

"on":
  pull_request_target:
    types: [labeled, synchronize, unlabeled]

concurrency:
  group: persona-review-labels-${{ github.event.pull_request.number }}-${{ github.event.label.name || 'push' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  adorno:
    if: >-
      contains(github.event.pull_request.labels.*.name, 'adorno-scan-requested') &&
      (github.event.action != 'unlabeled' || github.event.label.name == 'stop-requested')
    permissions:
      checks: write
      contents: read
      pull-requests: write
    uses: abuzucom/agents-personas/.github/workflows/adorno-ui-review.yml@0000000000000000000000000000000000000000
    with:
      personas_ref: "0000000000000000000000000000000000000000"
    secrets:
      MODEL_API_KEY: ${{ secrets.OLLAMA_API_KEY }}

  generay:
    if: >-
      contains(github.event.pull_request.labels.*.name, 'generay-scan-requested') &&
      (github.event.action != 'unlabeled' || github.event.label.name == 'stop-requested')
    permissions:
      checks: write
      contents: read
      pull-requests: write
    uses: abuzucom/agents-personas/.github/workflows/generay-time-review.yml@0000000000000000000000000000000000000000
    with:
      personas_ref: "0000000000000000000000000000000000000000"
    secrets:
      MODEL_API_KEY: ${{ secrets.OLLAMA_API_KEY }}

  havel:
    if: >-
      contains(github.event.pull_request.labels.*.name, 'havel-scan-requested') &&
      (github.event.action != 'unlabeled' || github.event.label.name == 'stop-requested')
    permissions:
      checks: write
      contents: read
      pull-requests: write
    uses: abuzucom/agents-personas/.github/workflows/havel-privacy-review.yml@0000000000000000000000000000000000000000
    with:
      personas_ref: "0000000000000000000000000000000000000000"
      # Declare the regime scope, for example "eu, us". An empty value
      # reviews the baseline classes alone and notes the unchecked regimes.
      regimes: ""
    secrets:
      MODEL_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
