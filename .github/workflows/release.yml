---
name: release

# The repository owner pushes a vX.Y.Z tag on a main commit. check-tag
# verifies the tag. The release job archives the tagged tree, attests the
# archive and SHA256SUMS.txt, and fills a draft. The repository owner
# publishes the draft by hand. Callers keep pinning full commit SHAs. The
# draft notes name the tagged commit for that pin.

"on":
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The tag must match the top CHANGELOG.md version and name a main commit.
  check-tag:
    name: check-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'

      - name: Check tag against the changelog
        run: python tools/release_personas.py check-tag "$GITHUB_REF_NAME"

      - name: Check tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME points to $GITHUB_SHA, which is not on main. Tag a main commit."
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME points to a commit on main."

  # Only this job writes. It never publishes. A rerun reuses the draft. A
  # file already on the draft must match this build's SHA-256.
  release:
    name: release
    needs: check-tag
    # The repository owner configures this environment with a required
    # reviewer. The job receives its write token only after that approval.
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The notes range starts after the previous stable tag. A shallow
          # checkout holds no tags.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'

      - name: Build source archive
        run: |
          assets="$RUNNER_TEMP/release-assets"
          mkdir -p "$assets"
          python tools/release_personas.py archive "${GITHUB_REF_NAME#v}" "$assets"
          python tools/release_personas.py check-assets "$assets" "${GITHUB_REF_NAME#v}"

      - name: Attest source archive
        id: attest-archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release-assets/agents-personas-*.tar.gz

      - name: Save archive attestation bundle
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_PATH: ${{ steps.attest-archive.outputs.bundle-path }}
        run: |
          set -euo pipefail
          assets="$RUNNER_TEMP/release-assets"
          version="${GITHUB_REF_NAME#v}"
          tag="$GITHUB_REF_NAME"
          repo="$GITHUB_REPOSITORY"
          archive="$assets/agents-personas-$version.tar.gz"
          bundle="$archive.sigstore.json"
          cp "$BUNDLE_PATH" "$bundle"
          # A rerun makes a bundle with a newer timestamp. The upload step
          # rejects a draft asset whose SHA-256 differs. A rerun therefore
          # reuses the bundle already on the draft. A draft asset is untrusted
          # input. The reused bundle must verify against this archive first.
          view_status=0
          release_json="$(gh release view "$tag" --repo "$repo" --json isDraft,assets 2>/dev/null)" || view_status=$?
          if [ "$view_status" -eq 0 ]; then
            if [ "$(jq -r '.isDraft' <<<"$release_json")" != "true" ]; then
              echo "Release $tag is already published. This job only fills drafts."
              exit 1
            fi
            bundle_name="$(basename "$bundle")"
            if jq -e --arg name "$bundle_name" '.assets[] | select(.name == $name)' <<<"$release_json" >/dev/null; then
              echo "Reusing $bundle_name from the draft."
              download_dir="$(mktemp -d "$RUNNER_TEMP/existing-bundle.XXXXXX")"
              gh release download "$tag" --repo "$repo" --pattern "$bundle_name" --dir "$download_dir"
              gh attestation verify "$archive" --repo "$repo" --bundle "$download_dir/$bundle_name"
              cp "$download_dir/$bundle_name" "$bundle"
            fi
          fi
          python tools/release_personas.py check-assets "$assets" "$version" --require-bundles

      - name: Write checksums and notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          repo="$GITHUB_REPOSITORY"
          notes="$RUNNER_TEMP/release-notes.md"
          python tools/release_personas.py checksums "$RUNNER_TEMP/release-assets"
          python tools/release_personas.py notes "${GITHUB_REF_NAME#v}" "$GITHUB_SHA" "$notes"
          # GitHub generated notes follow the fixed block. Each run asks for
          # them again, so a rerun refreshes the draft notes.
          previous="$(python tools/release_personas.py previous-tag "${GITHUB_REF_NAME#v}")"
          generate=(--method POST "repos/$repo/releases/generate-notes" -f "tag_name=$tag")
          if [ -n "$previous" ]; then generate+=(-f "previous_tag_name=$previous"); fi
          printf '\n' >> "$notes"
          gh api "${generate[@]}" --jq '.body' >> "$notes"
          cat "$RUNNER_TEMP/release-assets/SHA256SUMS.txt"

      - name: Attest checksums file
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release-assets/SHA256SUMS.txt

      - name: Upload to draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          repo="$GITHUB_REPOSITORY"
          assets="$RUNNER_TEMP/release-assets"
          view_status=0
          release_json="$(gh release view "$tag" --repo "$repo" --json isDraft,assets 2>/dev/null)" || view_status=$?
          if [ "$view_status" -eq 0 ]; then
            if [ "$(jq -r '.isDraft' <<<"$release_json")" != "true" ]; then
              echo "Release $tag is already published. This job only fills drafts."
              exit 1
            fi
            echo "Reusing the draft for $tag. Refreshing its notes."
            # --draft keeps the release a draft. A person publishes it by hand.
            gh release edit "$tag" --repo "$repo" --draft --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$tag" --repo "$repo" --draft --verify-tag \
              --title "agents-personas $tag" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
            release_json='{"assets": []}'
          fi
          # The draft may hold only this build's files. A stray file fails the job.
          declare -A on_draft=()
          while IFS= read -r name; do
            if [ -z "$name" ]; then continue; fi
            on_draft["$name"]=1
            if [ ! -f "$assets/$name" ]; then
              echo "The draft holds $name, which this build does not make."
              echo "Delete $name from the draft, then rerun the release job."
              exit 1
            fi
          done < <(jq -r '.assets[].name' <<<"$release_json")
          for file in "$assets"/*; do
            name="$(basename "$file")"
            if [ -n "${on_draft["$name"]+present}" ]; then
              download_dir="$(mktemp -d "$RUNNER_TEMP/existing-asset.XXXXXX")"
              gh release download "$tag" --repo "$repo" --pattern "$name" --dir "$download_dir"
              old="$(sha256sum "$download_dir/$name" | cut -d ' ' -f 1)"
              new="$(sha256sum "$file" | cut -d ' ' -f 1)"
              if [ "$old" != "$new" ]; then
                echo "$name on the draft has SHA-256 $old, but this build made $new."
                echo "Delete the draft, then run the tag build again."
                exit 1
              fi
              echo "$name is already on the draft with the same SHA-256."
            else
              gh release upload "$tag" "$file" --repo "$repo"
            fi
          done
          echo "Draft $tag holds the archive, its bundle, and SHA256SUMS.txt. Publish it by hand."
