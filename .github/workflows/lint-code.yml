---
name: Code Lint

# Runs make lint-code on every pull request. ruff, mypy, and yamllint check
# the engine, the personas, the matching tests, and the workflows this
# repository owns. Every tool comes from the hash-pinned requirements-dev.txt. The job
# holds no secret.

"on":
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-code:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.14'

      - name: Install lint requirements
        run: 'python -m pip install --requirement requirements-dev.txt --require-hashes --only-binary :all:'

      - name: Run the code linters
        run: make lint-code PYTHON=python
