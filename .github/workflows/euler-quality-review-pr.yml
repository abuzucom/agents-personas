---
name: euler-quality-review-pr

# Self-review: euler reviews this repository's pull requests after the
# Convention Sync Check finishes. A workflow_run job runs the workflow files
# and engine of the default branch, so a pull request cannot change the
# prompt, the prescan, or the adapter that receives the provider key.

"on":
  workflow_run:
    workflows: [Convention Sync Check]
    types: [completed]
  # Adding the euler-scan-requested label starts this review at once.
  # Removing stop-requested reviews the current head once.
  # pull_request_target runs this file from the default branch, so a pull
  # request cannot edit it. The engine never executes the pull request head.
  pull_request_target:
    types: [labeled, unlabeled]

permissions:
  contents: read

jobs:
  euler:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'pull_request_target' && github.event.action == 'labeled' &&
      github.event.label.name == 'euler-scan-requested') ||
      (github.event_name == 'pull_request_target' && github.event.action == 'unlabeled' &&
      github.event.label.name == 'stop-requested')
    permissions:
      checks: write
      contents: read
      pull-requests: write
    # The group sits on the job, not the workflow. Every label event
    # reaches every caller, and a caller skips the job for another
    # persona label. A skipped job joins no group and cancels nothing.
    # The group names the pull request, so two pull requests on one head
    # commit keep separate reviews. A fork workflow_run payload lists no
    # pull request. The head branch then stands in for the number.
    concurrency:
      group: >-
        euler-quality-review-${{ github.event.pull_request.number ||
        github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_branch }}-${{
        github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}
      cancel-in-progress: true
    uses: ./.github/workflows/euler-quality-review.yml
    with:
      personas_ref: ${{ github.sha }}
      # A pull request that changes only these root files gets a skipped
      # check run and no model call.
      paths: |
        !CHANGELOG.md
        !README.md
      # Test files and eval cases hold flagged patterns on purpose.
      exclude_paths: "tests/** reviewers/*/eval/cases/**"
    secrets:
      MODEL_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
