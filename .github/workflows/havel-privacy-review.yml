---
name: havel-privacy-review

# havel wrapper over the engine workflow. It fixes the persona. The
# modes input defaults to the privacy mode. Callers pin `uses:` and
# `personas_ref` to the same full commit SHA:
#
#   uses: abuzucom/agents-personas/.github/workflows/havel-privacy-review.yml@<sha>
#   with:
#     personas_ref: "<the same sha>"
#     regimes: "eu, us"
#   secrets:
#     MODEL_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
#
# The check run is named "havel / privacy". Pass only the provider key.
# regimes names profiles or slugs from docs/regimes/scope-profiles.md. An
# empty value, baseline, or undeclared reviews the baseline classes alone.
# The check summary and the comment then say that regime-specific issues may
# exist that the run did not check.

"on":
  workflow_call:
    inputs:
      personas_ref:
        description: "abuzucom/agents-personas commit SHA to load the engine and persona from. Match the uses: pin."
        required: true
        type: string
      modes:
        description: "Comma-separated havel review modes. Empty selects the default mode, privacy."
        required: false
        type: string
        default: ""
      pr_number:
        description: "Resolved pull request number for workflow_run callers."
        required: false
        type: string
        default: ""
      base_sha:
        description: "Resolved pull request base SHA for workflow_run callers."
        required: false
        type: string
        default: ""
      head_sha:
        description: "Resolved pull request head SHA for workflow_run callers."
        required: false
        type: string
        default: ""
      head_repo_url:
        description: "Resolved pull request head repository URL for workflow_run callers."
        required: false
        type: string
        default: ""
      head_repo_full_name:
        description: "Resolved pull request head repository name for workflow_run callers."
        required: false
        type: string
        default: ""
      model_call_command:
        description: "Optional adapter: python or python3, then a workspace .py path. Empty uses the engine one."
        required: false
        type: string
        default: ""
      pr_comment:
        description: "Post one comment per head SHA."
        required: false
        type: boolean
        default: true
      fail_on_block:
        description: "Fail the check on BLOCK. False concludes neutral. NEEDS-HUMAN warns and always concludes neutral."
        required: false
        type: boolean
        default: true
      fork_review:
        description: "Run the review through the protected fork-review environment."
        required: false
        type: boolean
        default: false
      same_repository_only:
        description: "Fail closed on a fork head before any job receives a secret. The guard wins over fork_review."
        required: false
        type: boolean
        default: false
      paths:
        description: >-
          Optional newline-separated globs. The review runs only when a changed file matches. A leading !
          excludes matching files.
        required: false
        type: string
        default: ""
      regimes:
        description: >-
          Comma-separated regime profiles or slugs from docs/regimes/scope-profiles.md. Empty declares no
          scope and reviews the baseline classes alone.
        required: false
        type: string
        default: ""
    secrets:
      MODEL_API_KEY:
        description: "Provider API key for the model adapter."
        required: false

permissions:
  contents: read

jobs:
  review:
    permissions:
      checks: write
      contents: read
      pull-requests: write
    uses: ./.github/workflows/review.yml
    with:
      persona: havel
      modes: ${{ inputs.modes }}
      personas_ref: ${{ inputs.personas_ref }}
      pr_number: ${{ inputs.pr_number }}
      base_sha: ${{ inputs.base_sha }}
      head_sha: ${{ inputs.head_sha }}
      head_repo_url: ${{ inputs.head_repo_url }}
      head_repo_full_name: ${{ inputs.head_repo_full_name }}
      model_call_command: ${{ inputs.model_call_command }}
      pr_comment: ${{ inputs.pr_comment }}
      fail_on_block: ${{ inputs.fail_on_block }}
      fork_review: ${{ inputs.fork_review }}
      same_repository_only: ${{ inputs.same_repository_only }}
      paths: ${{ inputs.paths }}
      # toJSON escapes the caller value. The engine places it in
      # TRUSTED_CONTEXT.options.regimes. The havel case_context hook refuses
      # a name outside the scope profiles before any envelope exists.
      persona_options: >-
        ${{ format('{{"regimes": {0}}}', toJSON(inputs.regimes)) }}
    secrets:
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
