---
name: adorno-ui-review-pr

# Self-review: adorno reviews this repository's pull requests only on
# request. The paths input excludes every file, so a pull request without
# the adorno-scan-requested label gets a skipped check and no model call.
# The label overrides that filter. Adding the label starts the review at
# once. A push to a labeled pull request reviews after the Convention Sync
# Check. Removing stop-requested reviews a labeled head once.
# workflow_run and pull_request_target run this file from the default
# branch, so a pull request cannot edit it. The engine never executes the
# pull request head.

"on":
  workflow_run:
    workflows: [Convention Sync Check]
    types: [completed]
  pull_request_target:
    types: [labeled, unlabeled]

permissions:
  contents: read

jobs:
  adorno:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request') ||
      (github.event_name == 'pull_request_target' && github.event.action == 'labeled' &&
      github.event.label.name == 'adorno-scan-requested') ||
      (github.event_name == 'pull_request_target' && github.event.action == 'unlabeled' &&
      github.event.label.name == 'stop-requested')
    permissions:
      checks: write
      contents: read
      pull-requests: write
    # The group sits on the job, not the workflow. Every label event
    # reaches every caller, and a caller skips the job for another
    # persona label. A skipped job joins no group and cancels nothing.
    concurrency:
      group: adorno-ui-review-${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}
      cancel-in-progress: true
    uses: ./.github/workflows/adorno-ui-review.yml
    with:
      personas_ref: ${{ github.sha }}
      paths: |
        !**
    secrets:
      MODEL_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
